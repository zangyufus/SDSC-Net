batch_size: 1
# batch_size: 16
epoch: 80
learning_rate: 1e-3
gpu: 0
# num_point: 1024
num_point: 2048
optimizer: Adam
weight_decay: 1e-4
normal: True
lr_decay: 0.5
step_size: 20

defaults:
  - _self_
  - model: Hengshuang

hydra:
  run:
    dir: log/partseg/${model.name}

  sweep:
    dir: log/partseg
    subdir: ${model.name}
